org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Project is on D: but default Pub cache is on C:; disable incremental Kotlin to avoid cross-drive path errors.
kotlin.incremental=false
android.useAndroidX=true
# Required by Flutter 3.47, NOT optional despite what the AGP 9 migration guide says.
# FlutterPlugin.kt:354 casts the android extension to the legacy AbstractAppExtension and
# uses applicationVariants, so the new DSL breaks plugin application outright. Flutter's own
# 3.47 template for AGP 9.1 ships both of these flags.
android.newDsl=false
android.builtInKotlin=false
# Removed for AGP 9:
#   android.enableJetifier            - no longer supported
#   android.r8.optimizedResourceShrinking - on by default from AGP 9.0
#   android.suppressUnsupportedCompileSdk - stale (was pinned to 34, compileSdk is 36)
